services:
  mysql:
    image: mysql:latest
    # image: docker.m.daocloud.io/library/mysql:8.0
    container_name: agent-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD} --silent
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  ocr-service:
    image: local/agent-ocr:linux-amd64
    # image: ocr_service-tesseract-ocr:latest
    container_name: ocr-service
    ports:
      - "${OCR_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  etcd:
    image: local/agent-etcd:v3.5.5
    # image: quay.io/coreos/etcd:v3.5.5
    container_name: milvus-etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command:
      - etcd
      - -advertise-client-urls=http://etcd:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - -data-dir=/etcd
    volumes:
      - etcd-data:/etcd

  minio:
    # image: local/agent-minio:RELEASE.2023-03-20T20-16-18Z
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: milvus-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  milvus:
    image: local/agent-milvus:v2.6.11
    # image: milvusdb/milvus:v2.6.11
    container_name: milvus
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_HTTP_PORT:-9091}:9091"
    volumes:
      - milvus-data:/var/lib/milvus
    depends_on:
      - etcd
      - minio

  agent-backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
      args:
        APT_PRIMARY_MIRROR: ${APT_PRIMARY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        APT_FALLBACK_PRIMARY_MIRROR: ${APT_FALLBACK_PRIMARY_MIRROR:-http://deb.debian.org/debian}
        APT_FALLBACK_SECURITY_MIRROR: ${APT_FALLBACK_SECURITY_MIRROR:-http://security.debian.org/debian-security}
        MODELSCOPE_CACHE: ${MODELSCOPE_CACHE:-/app/agent/agent_backend/data/modelscope_cache}
        MODELSCOPE_CACHE_SEED: ${MODELSCOPE_CACHE_SEED:-/opt/modelscope_cache_seed}
        EMBEDDING_LOCAL_MODEL_ID: ${EMBEDDING_LOCAL_MODEL_ID:-iic/nlp_gte_sentence-embedding_chinese-large}
        PRELOAD_MODELSCOPE_EMBED_MODEL: ${PRELOAD_MODELSCOPE_EMBED_MODEL:-true}
        ENABLE_CDE_SELENIUM_RUNTIME: ${ENABLE_CDE_SELENIUM_RUNTIME:-true}
    image: deploy-agent-backend:v8
    container_name: agent-backend
    environment:
      # 容器内监听地址/端口与 Nginx、健康检查的 agent-backend:5002 契约保持一致。
      APP_HOST: "0.0.0.0"
      APP_PORT: "5002"
      # 交付/测试环境禁用 Flask reloader，避免挂载目录变化时重启进程并中断长任务。
      DEBUG: "false"
      MAX_CONTENT_LENGTH_MB: ${MAX_CONTENT_LENGTH_MB:-512}
      AUTO_START_LLM: ${AUTO_START_LLM:-true}
      LLM_HOST: ${LLM_HOST:-127.0.0.1}
      LLM_PORT: ${LLM_PORT:-8024}
      MYSQL_URL: ${MYSQL_URL:-mysql+pymysql://agent:${DATABASE_PASSWORD}@8.130.160.66:3306/pre_review_db?charset=utf8mb4}
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      ES_URL: ${ES_URL:-http://host.docker.internal:9200}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-milvus}
      VECTOR_COLLECTION: ${VECTOR_COLLECTION:-agent_collection}
      MILVUS_URI: ${MILVUS_URI:-http://milvus:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-}
      MILVUS_DB_NAME: ${MILVUS_DB_NAME:-}
      OCR_SERVICE_URL: ${OCR_SERVICE_URL:-http://ocr-service:8000}
      OCR_TIMEOUT_SECONDS: ${OCR_TIMEOUT_SECONDS:-120}
      OCR_LANG: ${OCR_LANG:-chi_sim+eng}
      EMBEDDING_LOCAL_MODEL_ID: ${EMBEDDING_LOCAL_MODEL_ID:-iic/nlp_gte_sentence-embedding_chinese-large}
      EMBEDDING_LOCAL_SEQUENCE_LENGTH: ${EMBEDDING_LOCAL_SEQUENCE_LENGTH:-512}
      MODELSCOPE_CACHE: ${MODELSCOPE_CACHE:-/app/agent/agent_backend/data/modelscope_cache}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL}
      LLM_PARSE_MODEL: ${LLM_PARSE_MODEL}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL}
      LLM_RERANK_MODEL: ${LLM_RERANK_MODEL}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-120}
      LLM_PARSE_TIMEOUT_SECONDS: ${LLM_PARSE_TIMEOUT_SECONDS:-60}
      LLM_QWEN_CHAT_MODEL: ${LLM_QWEN_CHAT_MODEL}
      LLM_QWEN_LOCAL_CHAT_MODEL: ${LLM_QWEN_LOCAL_CHAT_MODEL}
      LLM_QWEN_LOCAL_CHAT_BASE_URL: ${LLM_QWEN_LOCAL_CHAT_BASE_URL}
      LLM_QWEN_LOCAL_CHAT_API_KEY_PATH: ${LLM_QWEN_LOCAL_CHAT_API_KEY_PATH}
      LLM_QWEN_LOCAL_CHAT_TIMEOUT_SECONDS: ${LLM_QWEN_LOCAL_CHAT_TIMEOUT_SECONDS:-120}
      LLM_DEEPSEEK_OCR_MODEL: ${LLM_DEEPSEEK_OCR_MODEL:-deepseek-ocr}
      LLM_DEEPSEEK_OCR_BASE_URL: ${LLM_DEEPSEEK_OCR_BASE_URL:-https://open.deepseek.cn/api/v1}
      LLM_DEEPSEEK_OCR_API_KEY_PATH: ${LLM_DEEPSEEK_OCR_API_KEY_PATH:-temp/key/guiji_key}
    ports:
      - "${BACKEND_PORT:-5002}:5002"
    volumes:
      - ../agent_backend/data:/app/agent/agent_backend/data
      - ../agent_backend/llm/temp/key:/app/agent/agent_backend/llm/temp/key:ro
      - ../agent_backend/llm/log:/app/agent/agent_backend/llm/log
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   mysql:
    #     condition: healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import socket; s=socket.create_connection(('127.0.0.1', 5002), 2); s.close()"
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 40s

  agent-frontend:
    build:
      context: ../..
      dockerfile: agent/deploy/frontend.Dockerfile
    image: deploy-agent-frontend:v8
    container_name: agent-frontend
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    depends_on:
      agent-backend:
        condition: service_healthy

volumes:
  mysql-data:
  etcd-data:
  minio-data:
  milvus-data:
